      YGG_PAYLOAD_EOF


      echo "App-filerne er skiftet ud. Databasen i /data er uroert."

      echo "Skemaet opdateres automatisk, naar serveren starter."

      '
  startup:
    command: "if node -e \"require('node:sqlite')\" >/dev/null 2>&1; then\n  exec node app/server.js\nelse\n  exec node --experimental-sqlite\
      \ app/server.js\nfi\n"
    done_regex: tovo lytter
    stop_timeout: 30
  ports:
  - name: web
    default: 3000
    protocol: tcp
  watchers:
  - name: Serverfejl i tovo
    pattern: \[fejl\]
    threshold: 5
    window_secs: 300
  events:
  - key: tovo_login_fejl
    label: Mislykket login i tovo
    match: \[sikkerhed\] login-fejl ip=(\S+)
  - key: tovo_login_spaerret
    label: Login spaerret af rate-limit
    match: \[sikkerhed\] login-spaerret ip=(\S+)
  backup:
    include: []
  wipe:
    paths:
    - tovo.db
    - tovo.db-wal
    - tovo.db-shm
    backup_first: true
